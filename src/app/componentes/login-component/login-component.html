<div class="login-container">

  <div class="logo">
    <span class="icon"></span>
    <span class="brand">Fapaz</span>
  </div>

  <div class="card">
    <h2>Log In</h2>

    
    <form (ngSubmit)="logIn()">

      <div class="form-group">
        <label>EMAIL</label>
        <input 
          type="email" 
          placeholder="Email"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input 
          type="password" 
          placeholder="Contraseña"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <div class="options">
        <label>
          <input type="checkbox" />
          Recordarme
        </label>
      </div>
      
      <button type="submit" class="login-btn" [disabled]="loading || loadingGoogle">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>

      <!-- 🟢 NUEVO: Separador y botón de Google -->
      <div class="divider">
        <span>o ingresa como Cliente</span>
      </div>

      <button type="button" class="google-btn" (click)="loginGoogle()" [disabled]="loading || loadingGoogle">
        <svg width="20" height="20" viewBox="0 0 48 48" style="vertical-align: middle; margin-right: 8px;">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.73 17.74 9.5 24 9.5z"></path>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
        <path fill="none" d="M0 0h48v48H0z"></path>
        </svg>
          {{ loadingGoogle ? 'Conectando...' : 'Continuar con Google' }}
      </button>

    </form>

  </div>

  <div class="footer">
    <span>T</span>
    <span>|</span>
    <span>G</span>
    <span>|</span>
    <span>H</span>
  </div>

</div>
