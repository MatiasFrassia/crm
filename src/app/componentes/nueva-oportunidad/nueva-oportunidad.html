<div class="background">
  <div class="form-container">
    <h2>Crear Oportunidad</h2>

    <app-cotizacion-dolar></app-cotizacion-dolar>

    <form class="form-grid" (ngSubmit)="guardar()">

      <!-- Título -->
      <div class="form-group">
        <label>Título *</label>
        <input 
          type="text" 
          name="titulo" 
          [(ngModel)]="form.titulo" 
          placeholder="Ej: Venta de servidores Dell" 
          required
        >
      </div>

      <!-- Buscador de Usuario Asignado (Solo Admin) -->
      @if (esAdmin) {
        <div class="form-group selector-usuario-container">
          <label>Usuario Asignado</label>
          <input 
            type="text" 
            name="filtroUsuario"
            [(ngModel)]="filtroUsuario" 
            (input)="onBuscarUsuario()" 
            (focus)="mostrarListaUsuarios = true" 
            (blur)="ocultarListaConDelay()"
            placeholder="Escriba nombre o apellido..." 
            autocomplete="off"
          >

          @if (mostrarListaUsuarios) {
            <ul class="dropdown-usuarios">
              @for (usuario of usuariosFiltrados; track usuario.id_usuario) {
                <li (mousedown)="seleccionarUsuario(usuario)">
                  {{ usuario.nombre }} {{ usuario.apellido }}
                </li>
              } @empty {
                <li class="sin-resultados">No se encontraron usuarios</li>
              }
            </ul>
          }
        </div>
      }

      <!-- Cliente -->
      <div class="form-group">
        <label>Cliente *</label>
        <input 
          type="text" 
          name="cliente" 
          [(ngModel)]="form.cliente" 
          placeholder="Ej: Cresata" 
          required
        >
      </div>

      <!-- Marca -->
      <div class="form-group">
        <label>Marca</label>
        <input 
          type="text" 
          name="marca" 
          [(ngModel)]="form.marca" 
          placeholder="Ej: Dell / Lenovo"
        >
      </div>

      <!-- Producto -->
      <div class="form-group">
        <label>Producto</label>
        <input 
          type="text" 
          name="producto" 
          [(ngModel)]="form.producto" 
          placeholder="Ej: Servidor PowerEdge"
        >
      </div>

      <!-- Fecha Cierre Estimado -->
      <div class="form-group">
        <label>Fecha Cierre Estimado</label>
        <input 
          type="date" 
          name="fechaCierreEstimado" 
          [(ngModel)]="form.fechaCierreEstimado"
        >
      </div>

      <!-- Monto Estimado -->
      <div class="form-group">
        <label>Monto Estimado ($)</label>
        <input 
          type="number" 
          name="monto" 
          [(ngModel)]="form.monto" 
          placeholder="0.00"
        >
      </div>

      <!-- Plazo Pago Proveedor -->
      <div class="form-group">
        <label>Plazo Pago Proveedor</label>
        <input 
          type="text" 
          name="plazoProveedor" 
          [(ngModel)]="form.plazoProveedor" 
          placeholder="Ej: 30 días"
        >
      </div>

      <!-- Plazo Pago Cliente -->
      <div class="form-group">
        <label>Plazo Pago Cliente</label>
        <input 
          type="text" 
          name="plazoCliente" 
          [(ngModel)]="form.plazoCliente" 
          placeholder="Ej: Contrado / 15 días"
        >
      </div>

      <!-- Observaciones -->
      <div class="form-group full-width">
        <label>Observaciones Iniciales</label>
        <textarea 
          name="observaciones" 
          [(ngModel)]="form.observaciones" 
          rows="3" 
          placeholder="Detalles del requerimiento inicial..."
        ></textarea>
      </div>

      <!-- Botones -->
      <div class="form-actions full-width">
        <button type="submit" [disabled]="loading">
          {{ loading ? 'Guardando...' : 'Guardar' }}
        </button>
        <button type="button" class="secondary" routerLink="/lista">Volver</button>
      </div>

    </form>
  </div>
</div>
