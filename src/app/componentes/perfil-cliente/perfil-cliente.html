<div class="background">
  <div class="form-container">
    <h2>Mi Perfil</h2>
    <p>Complete sus datos de facturación y contacto para poder procesar sus pedidos.</p>

    <form class="form-grid" (ngSubmit)="guardarPerfil()">
      
      <div class="form-group full-width">
        <label>Razón Social o Nombre Completo *</label>
        <input type="text" name="razon_social" [(ngModel)]="cliente.razon_social" required>
      </div>

      <div class="form-group">
        <label>CUIT / CUIL *</label>
        <input type="text" name="cuit" [(ngModel)]="cliente.cuit" placeholder="Ej: 20-12345678-9" required>
      </div>

      <div class="form-group">
        <label>Teléfono de Contacto *</label>
        <input type="text" name="telefono" [(ngModel)]="cliente.telefono" placeholder="Ej: 11 1234-5678" required>
      </div>

      <div class="form-group full-width">
        <label>Dirección Física o de Entrega *</label>
        <input type="text" name="direccion" [(ngModel)]="cliente.direccion" placeholder="Calle, Número, Localidad" required>
      </div>

      <div class="form-group full-width">
        <label>Email (Solo lectura)</label>
        <input type="email" [value]="cliente.email" disabled style="background-color: #f5f5f5; cursor: not-allowed;">
      </div>

      <div class="form-actions full-width">
        <button type="submit" [disabled]="loading">
          {{ loading ? 'Guardando...' : 'Guardar Cambios' }}
        </button>
      </div>

    </form>
  </div>
</div>
