<div class="background">
  <div class="form-container">
    <h2>Crear un Nuevo Pedido</h2>
    <p>Cuéntenos qué necesita y un asesor tomará su solicitud a la brevedad.</p>

    <form class="form-grid" (ngSubmit)="enviarPedido()">
      
      <!-- Título -->
      <div class="form-group full-width">
        <!-- Cliente Autocompletado (Solo lectura) -->
      <div class="form-group full-width">
        <label>Cliente Solicitante</label>
        <input 
          type="text" 
          [value]="clienteActual.razon_social" 
          disabled 
          style="background-color: #f5f5f5; color: #666;"
        >
      </div>
        <label>¿Qué está buscando? (Breve descripción) *</label>
        
        <input 
          type="text" 
          name="titulo" 
          [(ngModel)]="pedido.titulo" 
          placeholder="Ej: Presupuesto para 5 notebooks" 
          required
        >
      </div>

      <!-- Marca -->
      <div class="form-group">
        <label>Marca de preferencia (Opcional)</label>
        <input 
          type="text" 
          name="marca" 
          [(ngModel)]="pedido.marca" 
          placeholder="Ej: Dell / Lenovo / HP"
        >
      </div>

      <!-- Producto -->
      <div class="form-group">
        <label>Modelo o Producto (Opcional)</label>
        <input 
          type="text" 
          name="producto" 
          [(ngModel)]="pedido.producto" 
          placeholder="Ej: Thinkpad T14"
        >
      </div>

      <!-- Observaciones -->
      <div class="form-group full-width">
        <label>Detalles adicionales</label>
        <textarea 
          name="observaciones" 
          [(ngModel)]="pedido.observaciones" 
          rows="4" 
          placeholder="Especifique requerimientos técnicos, cantidades, urgencia..."
        ></textarea>
      </div>

      <!-- Botones -->
      <div class="form-actions full-width">
        <button type="submit" [disabled]="loading">
          {{ loading ? 'Enviando...' : 'Enviar Solicitud' }}
        </button>
      </div>

    </form>
  </div>
</div>
